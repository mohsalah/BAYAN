name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Block committed secrets
        run: |
          if git grep -nE 'sk-ant-[A-Za-z0-9_-]{10,}|ANTHROPIC_API_KEY=[^y ]' -- . ':!.env.example' ':!AGENTS.md' ':!README.md' ':!docs' ':!.github/workflows/ci.yml'; then
            echo "Possible secret committed"; exit 1
          fi
