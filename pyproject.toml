[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayan"
version = "0.1.0"
description = "Agentic research assistant: multi-library paper retrieval, evidence-backed reading, concept maps, research gaps and proposals."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["bayan*"]

[tool.setuptools.package-data]
bayan = ["static/*", "locales/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"bayan/analysis.py" = ["E501"]  # long prompt text
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
